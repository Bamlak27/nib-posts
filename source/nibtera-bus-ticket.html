<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:Menbere;src:url(Menbere-VariableFont_wght.ttf);font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1254px;height:1254px;position:relative;overflow:hidden;font-family:Inter,Helvetica,Arial,sans-serif;background:#fff6ed}
.photo,.hex{position:absolute;inset:0;width:1254px;height:1254px}
.wash{position:absolute;left:0;top:0;width:800px;height:400px;background:radial-gradient(ellipse 520px 330px at 170px 110px,rgba(255,255,255,.92),rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 100%);-webkit-mask-image:linear-gradient(#000 70%,transparent 100%)}
.logo{position:absolute;left:75px;top:40px;height:62px}
.pill{position:absolute;right:75px;top:28px;padding:10px 22px;background:#fff;border-radius:999px;box-shadow:0 8px 22px rgba(90,52,24,.25);display:flex;align-items:center}
.pill img{height:74px;display:block}
h1{position:absolute;left:75px;top:118px;font-family:Menbere;font-weight:800;font-size:104px;line-height:1.04;color:#8a4d1f;white-space:nowrap}
.foot{position:absolute;left:0;right:0;bottom:0;height:104px;background:#81481d;color:#fdb913}
.cap{position:absolute;left:0;top:4px;bottom:4px;width:318px;border:1.6px solid rgba(255,246,237,.55);border-left:0;border-radius:0 52px 52px 0}
.soc{position:absolute;left:68px;top:0;height:104px;display:flex;flex-direction:column;justify-content:center}
.fo{font-weight:800;font-size:20px;letter-spacing:.01em;line-height:1}
.row{display:flex;gap:7px;margin:7px 0 6px}.ic{width:27px;height:27px;border-radius:50%;background:#fdb913;display:flex;align-items:center;justify-content:center}.ic img{width:14px;height:14px;object-fit:contain}
.url{font-weight:500;font-size:19px;line-height:1;color:#ffd35a}
.qr{position:absolute;left:346px;top:19px;display:flex;align-items:center;gap:12px}.qr b{width:66px;height:66px;background:#fff;border-radius:6px;padding:4px;display:block}.qr b img{width:100%;height:100%;display:block}
.qr div{font-weight:800;line-height:1;letter-spacing:-.02em}.qr i{display:block;font-style:normal;font-size:17px}.qr em{display:block;font-style:normal;font-size:32px;margin-top:2px}
.hot{position:absolute;left:600px;top:20px;display:flex;align-items:center;gap:12px}.hot strong{font-weight:800;font-size:68px;line-height:1;letter-spacing:-.02em}
.sg{position:absolute;right:68px;top:0;height:104px;display:flex;flex-direction:column;justify-content:center;text-align:right}
.sg .am{font-family:Nokia;font-weight:700;font-size:25px;line-height:1.18}.sg .en{font-weight:800;font-size:15px;letter-spacing:-.02em;margin-top:3px}
.a1{position:absolute;left:62px;top:14px;width:236px}.a2{position:absolute;left:338px;top:14px;width:262px}.a3{position:absolute;left:640px;top:16px;width:250px}.a4{position:absolute;right:62px;bottom:10px;width:330px}
.c{position:absolute;display:block}.foot{overflow:visible!important}</style>
